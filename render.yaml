services:
  - type: web
    name: harnesshub-backend
    runtime: docker
    branch: main
    dockerContext: ./back
    dockerfilePath: ./back/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
    region: singapore
    plan: free
