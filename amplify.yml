version: 1
applications:
  - appRoot: client_front
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - nvm use 20
            - cd client_front && npm ci
        build:
          commands:
            - env | grep -E '^NEXT_PUBLIC_' >> client_front/.env.production || true
            - cd client_front && npm run build
      artifacts:
        baseDirectory: client_front/.next
        files:
          - '**/*'
      cache:
        paths:
          - client_front/node_modules/**/*
          - client_front/.next/cache/**/*
